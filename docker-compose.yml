name: ticketing

services:
  dynamodb:
    image: amazon/dynamodb-local:3.3.1
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
    ports:
      - "8000:8000"

  dynamodb-init:
    image: amazon/aws-cli:2.37.11
    depends_on:
      - dynamodb
    environment:
      DYNAMODB_ENDPOINT: http://dynamodb:8000
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
    volumes:
      - ./deployment/dynamodb/init-dynamodb.sh:/init-dynamodb.sh:ro
    entrypoint: ["/bin/sh", "/init-dynamodb.sh"]

  elasticmq:
    image: softwaremill/elasticmq-native:1.7.1
    ports:
      - "9324:9324"
    volumes:
      - ./deployment/elasticmq/elasticmq.conf:/opt/elasticmq.conf:ro

  app:
    build:
      context: .
      dockerfile: deployment/Dockerfile
    ports:
      - "8080:8080"
    environment:
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      DYNAMODB_ENDPOINT: http://dynamodb:8000
      SQS_ENDPOINT: http://elasticmq:9324
      ORDERS_QUEUE_URL: http://elasticmq:9324/000000000000/orders-queue
      ADMIN_API_KEY: ${ADMIN_API_KEY:-local-admin-key}
      RESERVATION_TTL: ${RESERVATION_TTL:-10m}
      PAYMENT_APPROVAL_RATE: ${PAYMENT_APPROVAL_RATE:-1.0}
    depends_on:
      dynamodb-init:
        condition: service_completed_successfully
      elasticmq:
        condition: service_started
